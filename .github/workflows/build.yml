name: Build executables

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: dizzys-web-panel-linux-x86_64
            exe: dist/dizzys-web-panel
          - os: windows-latest
            name: dizzys-web-panel-windows-x86_64.exe
            exe: dist/dizzys-web-panel.exe
          - os: macos-latest
            name: dizzys-web-panel-macos-arm64
            exe: dist/dizzys-web-panel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build
        run: pyinstaller --noconfirm --clean dizzys_web_panel.spec
      - name: Stage artifact
        shell: bash
        run: cp "${{ matrix.exe }}" "dist/${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/${{ matrix.name }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
